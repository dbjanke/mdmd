[project]
name = "mdmd"
version = "1.0.0"
description = "A read-only Markdown viewer for the Linux desktop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "linkify-it-py>=2.2.0",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "pyside6-essentials>=6.12.0",
]

[project.scripts]
mdmd = "mdmd.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # naming
    "RUF",      # ruff-specific
    "PTH",      # prefer pathlib
    "PL",       # pylint subset
    "C4",       # comprehensions
    "PIE",
    "RET",
    "TID",
]
ignore = [
    "PLR0911",  # many returns: match statements over token types read best flat
    "PLR0912",
    "PLR0913",
    "PLR2004",  # magic values in tests and match arms are named where they matter
]

[tool.ruff.lint.pep8-naming]
# Qt overrides use camelCase names fixed by the framework.
extend-ignore-names = ["intrinsicSize", "drawObject", "*Event", "sizeHint", "createMimeDataFromSelection", "eventFilter"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "N802"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["mdmd"]

[[tool.mypy.overrides]]
module = ["markdown_it.*", "mdit_py_plugins.*"]
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
qt_api = "pyside6"

[tool.coverage.run]
source = ["mdmd"]
branch = true
